name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir and OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Get deps
        run: mix deps.get

      - name: Audit Hex packages (retired and security advisories)
        run: mix hex.audit

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Sobelow
        run: mix sobelow --exit low --private --skip

      - name: Check Ash codegen is up to date
        run: mix ash.codegen --check

      - name: Check for compile-time dependency cycles
        run: mix xref graph --format cycles --label compile-connected --fail-above 0

      - name: Set up Ruby for licensed
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Check dependency licenses
        run: |
          gem install licensed -v 5.1.0 --no-document
          licensed status

      # Tests use the in-memory event store, so only the test database is needed.
      - name: Test
        run: mix test

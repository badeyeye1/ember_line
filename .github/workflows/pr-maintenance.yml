name: PR maintenance

# Keeps open pull requests pointing at the right base, and says when one is
# behind. It never pushes to a pull request's branch: commits pushed with the
# built-in GITHUB_TOKEN can't run CI, so an automatic update would leave a
# failed check on the pull request.
# - When a pull request is merged, the pull requests stacked on it move to the
#   merged pull request's base (usually main). With "Automatically delete head
#   branches" on, GitHub does this too; this is the safety net.
# - After every merge or push to main, each open pull request is compared with
#   its base. One comment says how many commits it's behind (edited as that
#   changes) and is deleted once the branch is up to date. Use the "Update
#   branch" button, or merge the base in, to catch up.

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be retargeted and commented"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      MERGED_HEAD: ${{ github.event.pull_request.head.ref }}
      MERGED_BASE: ${{ github.event.pull_request.base.ref }}
      MERGED_NUMBER: ${{ github.event.pull_request.number }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - name: Retarget stacked pull requests and flag ones that are behind
        shell: bash
        run: |
          set -uo pipefail
          marker="<!-- pr-maintenance:behind -->"

          list_prs() {
            gh pr list -R "$REPO" --state open --limit 200 --json number,baseRefName,headRefName
          }

          # The id of this workflow's comment on pull request $1, if any.
          comment_id() {
            gh api "repos/$REPO/issues/$1/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1
          }

          # Comment on, update, or clear the "behind" note for pull request $1.
          flag() {
            local n=$1 base=$2 head=$3 behind id body
            behind=$(gh api "repos/$REPO/compare/$(jq -rn --arg s "$base" '$s|@uri')...$(jq -rn --arg s "$head" '$s|@uri')" --jq .behind_by 2>/dev/null) || {
              echo "::warning::Could not compare #$n ($head) with $base"
              return
            }
            id=$(comment_id "$n")

            if [ "$behind" -gt 0 ]; then
              body="$marker
          This branch is **$behind commit$([ "$behind" -eq 1 ] || echo s) behind \`$base\`**. Bring it up to date before merging: use **Update branch** below, or merge \`$base\` into it. CI then runs on the updated branch."
              echo "#$n ($head) is $behind behind $base"
              [ -n "${DRY_RUN:-}" ] && return
              if [ -n "$id" ]; then
                gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
              else
                gh pr comment "$n" -R "$REPO" --body "$body" >/dev/null
              fi
            else
              echo "#$n ($head) is up to date with $base"
              if [ -n "$id" ] && [ -z "${DRY_RUN:-}" ]; then
                gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null
              fi
            fi
          }

          if [ "$EVENT" = "pull_request" ]; then
            echo "#$MERGED_NUMBER ($MERGED_HEAD) was merged into $MERGED_BASE"
            while read -r n; do
              [ -z "$n" ] && continue
              echo "Retargeting #$n from $MERGED_HEAD to $MERGED_BASE"
              [ -n "${DRY_RUN:-}" ] || gh pr edit "$n" -R "$REPO" --base "$MERGED_BASE" >/dev/null
            done < <(list_prs | jq -r --arg b "$MERGED_HEAD" '.[] | select(.baseRefName == $b) | .number')
          fi

          while read -r n base head; do
            [ -z "$n" ] && continue
            flag "$n" "$base" "$head"
          done < <(list_prs | jq -r '.[] | "\(.number) \(.baseRefName) \(.headRefName)"')
